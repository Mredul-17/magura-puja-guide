<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মাগুরা কাত্যায়নী পূজা – মণ্ডপ গাইড</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<style>
  :root { --bg:#F6F7FB; --card:#FFFFFF; --ink:#1E2540; --muted:#555B73; --line:#DDE1EC;
          --gold:#F2A900; --red:#C62828; --green:#2E7D5B; --tile:none; }
  html[data-theme="dusk"]  { --bg:#383840; --card:#45454E; --ink:#F3EFE8; --muted:#BEB9B1; --line:#5C5C66;
          --green:#5BC596; --tile:brightness(.82) sepia(.3) contrast(1.05); }
  html[data-theme="night"] { --bg:#0A1226; --card:#121D38; --ink:#E6ECFA; --muted:#93A0BF; --line:#22305A;
          --green:#5BC596; --tile:invert(1) hue-rotate(180deg) brightness(.85) contrast(.95); }

  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
         font-family:"Hind Siliguri", system-ui, sans-serif; line-height:1.5; transition:background .8s, color .8s; }

  #tabs { display:flex; gap:8px; padding:8px 10px; background:var(--card); border-bottom:1px solid var(--line); }
  #tabs button { flex:1; padding:11px 4px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg);
                 color:var(--ink); font:inherit; font-size:1rem; font-weight:600; box-shadow:0 2px 0 var(--line); }
  #tabs button:active { transform:translateY(1px); box-shadow:none; }
  #tabs button.on { background:var(--gold); border-color:var(--gold); color:#1E2540; box-shadow:none; }
  #tabs button.sos { flex:0 0 calc((100% - 16px) / 3); color:var(--red); border-color:var(--red); box-shadow:0 2px 0 var(--red); }
  #tabs button.sos.on { background:var(--red); border-color:var(--red); color:#fff; box-shadow:none; }

  #views { flex:1; position:relative; min-height:0; }
  .view { position:absolute; inset:0; display:none; overflow-y:auto; padding:14px; }
  .view.on { display:block; }
  #v-map { padding:0; overflow:hidden; }
  #map { position:absolute; inset:0; background:var(--bg); }
  .leaflet-tile-pane { filter:var(--tile); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--card); color:var(--ink); }

  #bar { position:absolute; top:10px; left:10px; right:10px; max-width:520px; z-index:1000;
         background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
         box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #chip { font-weight:600; margin-top:6px; }
  #chip:empty { display:none; }
  #locate, #gear { position:absolute; right:10px; bottom:34px; z-index:1000; width:46px; height:46px; border-radius:50%;
            border:1px solid var(--line); background:var(--card); color:#1A73E8; display:grid; place-items:center; padding:0;
            box-shadow:0 3px 10px rgba(0,0,0,.3); }
  #gear { bottom:90px; color:var(--ink); }

  label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 3px; }
  .row { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .row:first-child { margin-top:0; }
  .row label { margin:0; width:52px; flex:none; }
  select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
           background:var(--card); color:var(--ink); font:inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; max-width:560px; margin:0 auto 12px; }
  .note { font-size:.8rem; color:var(--muted); margin:8px 0 0; }
  .err { color:var(--red); }
  .empty { color:var(--muted); }
  .mini { border:1px solid var(--gold); background:var(--gold); color:#1E2540; padding:6px 10px; border-radius:6px; font:inherit; font-weight:600; }

  .pin { width:34px; height:34px; border-radius:50%; background:var(--gold); border:2px solid #fff;
         display:grid; place-items:center; font-size:18px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .pin.veg { background:#2E7D5B; }
  .pin.hosp { background:#C62828; }
  .me { width:20px; height:20px; border-radius:50%; background:#1A73E8; border:3px solid #fff;
        box-shadow:0 0 0 7px rgba(26,115,232,.28); }

  .mlabel { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px;
            font-weight:600; padding:2px 7px; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .mlabel.leaflet-tooltip-right::before { border-right-color:var(--card); }

  .emg { border-left:5px solid var(--gold); }
  .emg.red { border-left-color:var(--red); }
  .emg b { display:block; font-size:1.05rem; }
  .emg small { color:var(--muted); }
  .num { font-size:1.6rem; font-weight:700; margin:2px 0 8px; }
  .call { display:block; text-align:center; background:var(--green); color:#fff; text-decoration:none;
          padding:12px; border-radius:8px; font-weight:700; }
  .red .call { background:var(--red); }

  .overlay { position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
  .overlay[hidden] { display:none; }
  #gate { align-items:center; }
  .panel { width:100%; max-width:520px; background:var(--card); color:var(--ink); border-radius:16px 16px 0 0;
           padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #gate .panel { border-radius:16px; margin:16px; }
  .panel h2 { margin:0 0 6px; font-size:1.1rem; }
  .panel p { margin:0 0 14px; color:var(--muted); }
  .grp { font-size:.88rem; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px 6px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg);
                color:var(--ink); font:inherit; font-weight:600; }
  .seg button.on { background:var(--gold); border-color:var(--gold); color:#1E2540; }
  #gate .seg button { padding:16px 6px; font-size:1.1rem; }
  .close { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px; background:var(--ink); color:var(--card);
           font:inherit; font-weight:700; }
</style>
</head>
<body>

<nav id="tabs">
  <button class="on" data-tab="map" data-i18n="tabMap">ম্যাপ</button>
  <button class="sos" data-tab="emg" data-i18n="tabCall">জরুরি কল</button>
</nav>

<div id="views">

  <!-- ভাগ ১: ম্যাপ -->
  <div id="v-map" class="view on">
    <div id="map"></div>
    <div id="bar">
      <div class="row"><label for="fromMap" data-i18n="from">থেকে</label><select id="fromMap"></select></div>
      <div class="row"><label for="toMap" data-i18n="to">যাব</label><select id="toMap"></select></div>
      <div id="chip"></div>
    </div>
    <button id="gear" data-aria="ariaSettings" aria-label="সেটিংস"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    <button id="locate" data-aria="ariaLocate" aria-label="আমার অবস্থান"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>

  <!-- ভাগ ২: জরুরি কল -->
  <div id="v-emg" class="view"><div id="emgList"></div></div>

</div>

<!-- সেটিংস: ভাষা ও থিম -->
<div id="sheet" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="settings">সেটিংস</h2>
    <div class="grp" data-i18n="language">ভাষা</div>
    <div class="seg"><button data-lang="bn">বাংলা</button><button data-lang="en">English</button></div>
    <div class="grp" data-i18n="theme">থিম</div>
    <div class="seg">
      <button data-theme-pref="auto" data-i18n="themeAuto">অটো (সময় অনুযায়ী)</button>
      <button data-theme-pref="light" data-i18n="themeLight">লাইট</button>
    </div>
    <button class="close" id="sheetClose" data-i18n="close">বন্ধ করুন</button>
  </div>
</div>

<div id="gate" class="overlay" hidden>
  <div class="panel">
    <h2>ভাষা বাছুন / Choose language</h2>
    <p>আপনি কোন ভাষায় অ্যাপটি ব্যবহার করবেন?<br>Which language would you like to use?</p>
    <div class="seg"><button data-gate="bn">বাংলা</button><button data-gate="en">English</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>

const CENTER = [23.4855, 89.4198];

const MANDAPS = [
  { name: "জামরুলতলা সর্বজনীন পূজা মন্দির", nameEn: "Jamrultala Sarbojanin Puja Mandir", area: "জামরুলতলা", areaEn: "Jamrultala", lat: 23.4886617, lng: 89.4268502 },
  { name: "জামরুলতলা সিকদার বাড়ি পূজা মন্দির", nameEn: "Jamrultala Sikdar Bari Puja Mandir", area: "জামরুলতলা", areaEn: "Jamrultala", lat: 23.4885848, lng: 89.4268686 },
  { name: "তাতিপাড়া সর্বজনীন পূজা মন্দির", nameEn: "Tatipara Sarbojanin Puja Mandir", area: "তাতিপাড়া", areaEn: "Tatipara", lat: 23.4836648, lng: 89.4276022 },
  { name: "সাদ্দৌয়া আশ্রম", nameEn: "Saddouya Ashram", area: "সাদ্দৌয়া", areaEn: "Saddouya", lat: 23.4865882, lng: 89.4323302 },
  { name: "বেলতলা মন্দির , সাদ্দৌয়া", nameEn: "Beltola Mandir, Saddouya", area: "সাদ্দৌয়া", areaEn: "Saddouya", lat: 23.4869123, lng: 89.4310012 },
  { name: "সাহাপাড়া নতুন বাজার স্মৃতি সংঘ", nameEn: "Shahapara Notun Bazar Smriti Sangha", area: "নতুন বাজার", areaEn: "Notun Bazar", lat: 23.4929247, lng: 89.4139189 },
  { name: "ছানাবাবুর বটতলা", nameEn: "Chhanababur Batatala", area: "নতুন বাজার", areaEn: "Notun Bazar", lat: 23.4959645, lng: 89.4113262 },
  { name: "নিতাই গৌর গোপাল সেবাশ্রম", nameEn: "Nitai Gaur Gopal Sebashram", area: "নতুন বাজার", areaEn: "Notun Bazar", lat: 23.4960995, lng: 89.4130904 },
  { name: "পারনান্দুয়ালী বৌ বাজার", nameEn: "Parnanduali Bou Bazar", area: "পারনান্দুয়ালী", areaEn: "Parnanduali", lat: 23.4928389, lng: 89.4285195 },

  { name: "মাগুরা ইসকন মন্দির", nameEn: "Magura ISKCON Mandir", lat: 23.4942832, lng: 89.4138723 },
  { name: "শিবরামপুর পূজা মন্দির", nameEn: "Shibrampur Puja Mandir", lat: 23.4982549, lng: 89.3990521 },
  { name: "বাটিকা ডাঙ্গা", nameEn: "Batika Danga", lat: 23.4988726, lng: 89.4023183 },
  { type: "restaurant", name: "নিরামিষ রেস্টুরেন্ট জামরুলতলা", nameEn: "Vegetarian Restaurant, Jamrultala", lat: 23.4886503, lng: 89.4268810 },
  { name: "পারনান্দুয়ালী ১", nameEn: "Parnanduali 1", lat: 23.4923611, lng: 89.4259747 },
  { name: "নতুনবাজার (নতুন)", nameEn: "Notun Bazar (New)", lat: 23.4967341, lng: 89.4142770 },
  { type: "hospital", name: "মাগুরা সদর হাসপাতাল", nameEn: "Magura Sadar Hospital", lat: 23.4859243, lng: 89.4219635 }
];

const EMERGENCY = [
  { name: "জাতীয় জরুরি সেবা", nameEn: "National Emergency Service",
    note: "পুলিশ, ফায়ার সার্ভিস ও অ্যাম্বুলেন্স – ২৪ ঘণ্টা, বিনা মূল্যে", noteEn: "Police, Fire Service and Ambulance – 24 hours, free of charge",
    number: "999", red: true },
  { name: "মাগুরা পুলিশ", nameEn: "Magura Police", note: "Officer in Charge (OC)", noteEn: "Officer in Charge (OC)", number: "01320-145170" },
  { name: "মাগুরা পুলিশ", nameEn: "Magura Police", note: "Inspector (Investigation)", noteEn: "Inspector (Investigation)", number: "01320-145171" },
  { name: "মাগুরা পুলিশ", nameEn: "Magura Police", note: "Inspector (Operations)", noteEn: "Inspector (Operations)", number: "01320-145172" },
  { name: "মাগুরা পুলিশ", nameEn: "Magura Police", note: "Duty Officer", noteEn: "Duty Officer", number: "01320-145175" },
  { name: "মাগুরা ফায়ার সার্ভিস", nameEn: "Magura Fire Service", note: "", noteEn: "", number: "01901022868" }
];

const TX = {
  bn: {
    title: "মাগুরা কাত্যায়নী পূজা – মণ্ডপ গাইড", tabMap: "ম্যাপ", tabCall: "জরুরি কল", from: "থেকে", to: "যাব",
    myLoc: "📍 আমার অবস্থান", allMandaps: "সব মণ্ডপ দেখান", goHere: "এখানে যান", call: "কল করুন",
    noNumber: "নম্বর এখনো যোগ করা হয়নি", settings: "সেটিংস", language: "ভাষা", theme: "থিম",
    themeAuto: "অটো (সময় অনুযায়ী)", themeLight: "লাইট", close: "বন্ধ করুন",
    ariaLocate: "আমার অবস্থান", ariaSettings: "সেটিংস",
    searching: "রুট খোঁজা হচ্ছে…", same: "শুরু আর গন্তব্য একই। আলাদা মণ্ডপ বেছে নিন।",
    noLoc: "আপনার অবস্থান পাওয়া যায়নি। ফোনের লোকেশন চালু করুন, অথবা শুরুতে একটি মণ্ডপ বেছে নিন।",
    approx: "(আনুমানিক)", noGeo: "এই ব্রাউজারে লোকেশন সুবিধা নেই।",
    shortest: "সবচেয়ে ছোট পথ। অন্য পথ দেখতে ধূসর রেখায় ট্যাপ করুন।",
    other: "এটা সবচেয়ে ছোট পথ নয়। ছোট পথে ফিরতে ধূসর রেখায় ট্যাপ করুন।",
    min: "মিনিট", hour: "ঘণ্টা", dist: x => x + " কিমি", walkText: x => "হেঁটে প্রায় " + x
  },
  en: {
    title: "Magura Katyayani Puja – Mandap Guide", tabMap: "Map", tabCall: "Emergency", from: "From", to: "To",
    myLoc: "📍 My location", allMandaps: "Show all mandaps", goHere: "Go here", call: "Call",
    noNumber: "Number not added yet", settings: "Settings", language: "Language", theme: "Theme",
    themeAuto: "Auto (by time of day)", themeLight: "Light", close: "Close",
    ariaLocate: "My location", ariaSettings: "Settings",
    searching: "Finding route…", same: "Start and destination are the same. Choose a different mandap.",
    noLoc: "Your location was not found. Turn on location on your phone, or pick a mandap as the starting point.",
    approx: "(approx.)", noGeo: "Location is not available in this browser.",
    shortest: "Shortest route. Tap a grey line to see another route.",
    other: "This is not the shortest route. Tap the grey line to go back to the shortest one.",
    min: "min", hour: "h", dist: x => x + " km", walkText: x => "About " + x + " on foot"
  }
};


const $ = id => document.getElementById(id);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = store.get("lang") || "";                                // "bn" / "en"; ফাঁকা মানে প্রথমবার
let themePref = store.get("theme") === "light" ? "light" : "auto"; // "light" / "auto"

const t = k => TX[lang || "bn"][k];
const num = (n, d = 0) => n.toLocaleString(lang === "en" ? "en-US" : "bn-BD", { maximumFractionDigits: d });
const nm = m => (lang === "en" && m.nameEn) || m.name;
const ar = m => lang === "en" ? m.areaEn : m.area;

function applyTheme() {
  const forced = new URLSearchParams(location.search).get("theme");
  const h = new Date().getHours();
  const auto = (h >= 6 && h < 16) ? "day" : (h >= 16 && h < 19) ? "dusk" : "night";
  document.documentElement.dataset.theme = forced || (themePref === "light" ? "day" : auto);
}

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#tabs button, .view").forEach(e => e.classList.remove("on"));
    btn.classList.add("on");
    $("v-" + btn.dataset.tab).classList.add("on");
    if (btn.dataset.tab === "map") map.invalidateSize();
  };
});

const map = L.map("map", { zoomControl: false }).setView(CENTER, 14);
L.control.zoom({ position: "bottomleft" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);

const pinIcon = L.divIcon({ className: "", html: '<div class="pin">🛕</div>', iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18] });
const vegIcon = L.divIcon({ className: "", html: '<div class="pin veg">🥗</div>', iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18] });
const hospIcon = L.divIcon({ className: "", html: '<div class="pin hosp">🏥</div>', iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18] });
const meIcon  = L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });

function popupFor(m, i) {
  const box = document.createElement("div");
  box.innerHTML = "<b>" + nm(m) + "</b><br>" + (ar(m) ? ar(m) + "<br>" : "");
  const btn = document.createElement("button");
  btn.className = "mini"; btn.textContent = t("goHere");
  btn.onclick = () => setDest(String(i));
  box.appendChild(btn);
  return box;
}

const markers = MANDAPS.map((m, i) =>
  L.marker([m.lat, m.lng], { icon: m.type === "restaurant" ? vegIcon : m.type === "hospital" ? hospIcon : pinIcon }).addTo(map).bindPopup(popupFor(m, i)));

function labelText(name, zoom) {
  if (zoom < 15) return "";
  const words = name.split(" ");
  const n = zoom === 15 ? 1 : zoom === 16 ? 2 : words.length;
  return words.length <= n ? name : words.slice(0, n).join(" ") + "…";
}
function updateLabels() {
  const z = map.getZoom();
  markers.forEach((mk, i) => {
    mk.unbindTooltip();
    const text = labelText(nm(MANDAPS[i]), z);
    if (text) mk.bindTooltip(text, { permanent: true, direction: "right", offset: [18, 0], className: "mlabel" });
  });
}
map.on("zoomend", updateLabels);

if (location.search.includes("edit")) {
  map.on("click", e => L.popup().setLatLng(e.latlng)
    .setContent("<b>" + e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5) + "</b>").openOn(map));
}

function fillSelects() {
  const f = $("fromMap").value || "me", d = $("toMap").value || "";
  const opts = MANDAPS.map((m, i) => '<option value="' + i + '">' + nm(m) + (ar(m) ? " – " + ar(m) : "") + "</option>").join("");
  $("fromMap").innerHTML = '<option value="me">' + t("myLoc") + "</option>" + opts;
  $("toMap").innerHTML = '<option value="">' + t("allMandaps") + "</option>" + opts;
  $("fromMap").value = f; $("toMap").value = d;
}

function renderEmergency() {
  $("emgList").innerHTML = "";
  EMERGENCY.forEach(e => {
    const card = document.createElement("div");
    card.className = "card emg" + (e.red ? " red" : "");
    const note = lang === "en" ? e.noteEn : e.note;
    let html = "<b>" + (lang === "en" ? e.nameEn : e.name) + "</b>" + (note ? "<small>" + note + "</small>" : "");
    html += e.number
      ? '<div class="num">' + e.number + '</div><a class="call" href="tel:' + e.number + '">📞 ' + t("call") + "</a>"
      : '<div class="empty">' + t("noNumber") + "</div>";
    card.innerHTML = html;
    $("emgList").appendChild(card);
  });
}

function updateSheet() {
  document.querySelectorAll("#sheet [data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === (lang || "bn")));
  document.querySelectorAll("#sheet [data-theme-pref]").forEach(b => b.classList.toggle("on", b.dataset.themePref === themePref));
}

function applyLang() {
  document.documentElement.lang = lang || "bn";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.aria)));
  fillSelects();
  renderEmergency();
  markers.forEach((mk, i) => mk.setPopupContent(popupFor(MANDAPS[i], i)));
  updateLabels();
  updateSheet();
  if (dest !== null) updateRoute(); else $("chip").textContent = "";
}

function chooseLang(l) {
  lang = l; store.set("lang", l);
  $("gate").hidden = true;
  applyLang();
  startWatch();
}
document.querySelectorAll("#sheet [data-lang]").forEach(b => b.onclick = () => chooseLang(b.dataset.lang));
document.querySelectorAll("#gate [data-gate]").forEach(b => b.onclick = () => chooseLang(b.dataset.gate));
document.querySelectorAll("#sheet [data-theme-pref]").forEach(b => b.onclick = () => {
  themePref = b.dataset.themePref; store.set("theme", themePref); applyTheme(); updateSheet();
});
$("gear").onclick = () => { $("sheet").hidden = false; };
$("sheetClose").onclick = () => { $("sheet").hidden = true; };
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").hidden = true; };

function straightKm(a, b) {            
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}

const cache = {};                      
const lngLat = (a, b) => a[1] + "," + a[0] + ";" + b[1] + "," + b[0];

function getRoutes(a, b) {
  const key = "car|" + lngLat(a, b);
  cache[key] = cache[key] || fetch(
    "https://router.project-osrm.org/route/v1/driving/" + lngLat(a, b) +
    "?overview=full&geometries=geojson&alternatives=true")
    .then(r => r.json())
    .then(d => d.routes.map(r => ({ km: r.distance / 1000, geo: r.geometry, exact: true }))
                       .sort((x, y) => x.km - y.km))
    .catch(() => { delete cache[key]; return [{ km: straightKm(a, b) * 1.3, geo: null, exact: false }]; });
  return cache[key];
}

function getWalk(a, b) {
  const key = "foot|" + lngLat(a, b);
  cache[key] = cache[key] || fetch(
    "https://routing.openstreetmap.de/routed-foot/route/v1/driving/" + lngLat(a, b) + "?overview=false")
    .then(r => r.json())
    .then(d => ({ min: d.routes[0].duration / 60 }))
    .catch(() => { delete cache[key]; return { min: straightKm(a, b) * 1.3 / 5 * 60 }; });
  return cache[key];
}

function fmtTime(min) {
  min = Math.max(1, Math.round(min));
  if (min < 60) return num(min) + " " + t("min");
  const h = Math.floor(min / 60), r = min % 60;
  return num(h) + " " + t("hour") + (r ? " " + num(r) + " " + t("min") : "");
}
let me = null, meMarker = null, dest = null, routeLayers = [];

function fitAll() {
  const pts = MANDAPS.map(m => [m.lat, m.lng]);
  if (me && straightKm(me, CENTER) < 30) pts.push(me);   
  map.fitBounds(pts, { paddingTopLeft: [40, 150], paddingBottomRight: [40, 70] });
}

function watchMe() {
  if (!navigator.geolocation) { $("chip").textContent = t("noGeo"); return; }
  navigator.geolocation.watchPosition(p => {
    const first = !me;
    me = [p.coords.latitude, p.coords.longitude];
    if (meMarker) meMarker.setLatLng(me);
    else meMarker = L.marker(me, { icon: meIcon, zIndexOffset: 1000 }).addTo(map);
    if (first) { dest === null ? fitAll() : updateRoute(); }
  }, () => {},  
  { enableHighAccuracy: true, maximumAge: 10000 });
}

let watching = false;                  
function startWatch() { if (!watching) { watching = true; watchMe(); } }

$("locate").onclick = () => { if (me) map.setView(me, 16); else startWatch(); };


function setDest(v) {
  dest = v === "" ? null : Number(v);
  $("toMap").value = v;
  updateRoute();
}

function setFrom(v) {
  $("fromMap").value = v;
  updateRoute();
}


function startPoint() {
  const v = $("fromMap").value;
  return v === "me" ? me : [MANDAPS[v].lat, MANDAPS[v].lng];
}

function clearRoutes() { routeLayers.forEach(l => map.removeLayer(l)); routeLayers = []; }


function drawRoutes(a, b, routes, sel, onPick) {
  clearRoutes();
  routes.map((_, i) => i).sort((x, y) => (x === sel) - (y === sel)).forEach(i => {   // বাছা পথ সবার উপরে
    const on = i === sel;
    const style = { color: on ? "#E53935" : "#8A8FA3", weight: on ? 7 : 8, opacity: on ? 1 : .85 };
    const line = routes[i].geo ? L.geoJSON(routes[i].geo, { style })
                               : L.polyline([a, b], { ...style, dashArray: "8 8" });
    line.on("click", () => onPick(i)).addTo(map);
    routeLayers.push(line);
  });
}

async function updateRoute() {
  const idx = dest, from = $("fromMap").value;
  clearRoutes();
  $("chip").textContent = "";
  if (idx === null) { fitAll(); return; }

  const m = MANDAPS[idx], b = [m.lat, m.lng], a = startPoint();
  if (from !== "me" && Number(from) === idx) {
    $("chip").innerHTML = '<span class="err">' + t("same") + "</span>";
    return;
  }
  if (!a) {
    map.setView(b, 16); markers[idx].openPopup();
    $("chip").innerHTML = '<span class="err">' + t("noLoc") + "</span>";
    return;
  }
  $("chip").textContent = t("searching");
  const [routes, walk] = await Promise.all([getRoutes(a, b), getWalk(a, b)]);
  if (dest !== idx || $("fromMap").value !== from) return;  

  const show = sel => {
    const r = routes[sel];
    drawRoutes(a, b, routes, sel, show);
    $("chip").innerHTML = "<div>" + nm(m) + "</div><div>" + t("dist")(num(r.km, 1)) + (r.exact ? "" : " " + t("approx")) +
      ", " + t("walkText")(fmtTime(walk.min)) + "</div>" +
      (routes.length > 1 ? '<div class="note">' + (sel === 0 ? t("shortest") : t("other")) + "</div>" : "");
  };
  show(0);
  map.fitBounds(L.featureGroup(routeLayers).getBounds(), { paddingTopLeft: [40, 200], paddingBottomRight: [40, 70] });
}

$("toMap").onchange   = e => setDest(e.target.value);
$("fromMap").onchange = e => setFrom(e.target.value);

$("gate").hidden = !!lang;             
applyTheme();
setInterval(applyTheme, 60000);
applyLang();
fitAll();
updateLabels();
if (lang) startWatch();
</script>
</body>
</html>
